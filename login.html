<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TempControl</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .login-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 1rem;
      padding: 3rem 2rem;
      backdrop-filter: blur(10px);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #a5b4fc;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #22c55e;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(34, 197, 194, 0.3);
      border-radius: 0.5rem;
      color: #e0e7ff;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
      background: rgba(15, 23, 42, 1);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      color: #0a0e27;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      display: none;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      display: block;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #86efac;
      display: block;
    }

    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #a5b4fc;
    }

    .signup-link a {
      color: #22c55e;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .signup-link a:hover {
      color: #06b6d4;
    }

    .loading {
      display: none;
      text-align: center;
      color: #a5b4fc;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div class="logo">🌡️ TempControl</div>
      <h1>Login</h1>
      <p class="subtitle">Acesse sua conta para continuar</p>

      <div id="messageBox" class="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="Sua senha">
        </div>

        <button type="submit" class="btn">Entrar</button>
        <div class="loading" id="loading">Carregando...</div>
      </form>

      <div class="signup-link">
        Não tem uma conta? <a href="signup.html">Cadastre-se aqui</a>
      </div>
    </div>
  </div>

  <script>
    // ALTERE PARA SUAS CREDENCIAIS SUPABASE
    const SUPABASE_URL = 'https://seu-projeto.supabase.co';
    const SUPABASE_ANON_KEY = 'sua-chave-anonima';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const messageBox = document.getElementById('messageBox');
    const loadingDiv = document.getElementById('loading');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      console.log('[v0] Tentando login com email:', email);
      
      loadingDiv.style.display = 'block';
      messageBox.className = 'message';
      messageBox.textContent = '';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error('[v0] Erro de login:', error.message);
          throw error;
        }

        console.log('[v0] Login bem-sucedido:', data.user.email);
        messageBox.className = 'message success';
        messageBox.textContent = 'Login realizado com sucesso! Redirecionando...';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        console.error('[v0] Erro:', error);
        messageBox.className = 'message error';
        messageBox.textContent = error.message || 'Erro ao fazer login. Tente novamente.';
      } finally {
        loadingDiv.style.display = 'none';
      }
    });

    window.addEventListener('load', async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          console.log('[v0] Usuário já está logado');
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('[v0] Erro ao verificar sessão:', error);
      }
    });
  </script>
</body>
</html>
