<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Thermite</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.8.0/dist/mqtt.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e7ff;
      line-height: 1.6;
    }

    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: rgba(10, 14, 39, 0.95);
      border-right: 1px solid rgba(34, 197, 194, 0.2);
      padding: 2rem 1rem;
      overflow-y: auto;
      position: fixed;
      height: 100vh;
    }

    .main-content {
      flex: 1;
      margin-left: 250px;
      padding: 2rem;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-menu {
      list-style: none;
      margin-bottom: 2rem;
    }

    .nav-menu li {
      margin-bottom: 0.5rem;
    }

    .nav-menu a {
      color: #a5b4fc;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      display: block;
      transition: all 0.3s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      background: rgba(34, 197, 194, 0.2);
      color: #22c55e;
    }

    .logout-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: auto;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(34, 197, 194, 0.2);
    }

    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .mqtt-status {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mqtt-status.connected {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .mqtt-status.disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .device-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 1rem;
      padding: 2rem;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .device-card:hover {
      border-color: rgba(34, 197, 194, 0.8);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(34, 197, 194, 0.1);
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1.5rem;
    }

    .device-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #22c55e;
    }

    .status-badge {
      padding: 0.4rem 0.8rem;
      border-radius: 0.3rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-badge.normal {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }

    .status-badge.warning {
      background: rgba(251, 146, 60, 0.2);
      color: #fed7aa;
    }

    .status-badge.critical {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .temperature-display {
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .device-info {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .device-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      color: #a5b4fc;
    }

    .device-info-row:last-child {
      margin-bottom: 0;
    }

    .label {
      color: #a5b4fc;
      font-weight: 600;
    }

    .value {
      color: #22c55e;
      font-weight: 600;
    }

    .chart-container {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 3rem;
      backdrop-filter: blur(10px);
    }

    .chart-container h2 {
      color: #22c55e;
      margin-bottom: 1.5rem;
      font-size: 1.3rem;
    }

    .chart-wrapper {
      position: relative;
      height: 400px;
    }

    .alerts-container {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 1rem;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .alerts-container h2 {
      color: #22c55e;
      margin-bottom: 1.5rem;
      font-size: 1.3rem;
    }

    .alert-item {
      background: rgba(15, 23, 42, 0.5);
      border-left: 4px solid;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alert-item.warning {
      border-color: #fb923c;
      background: rgba(251, 146, 60, 0.1);
    }

    .alert-item.critical {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .alert-message {
      flex: 1;
    }

    .alert-time {
      color: #a5b4fc;
      font-size: 0.85rem;
    }

    .no-alerts {
      text-align: center;
      color: #a5b4fc;
      padding: 2rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #a5b4fc;
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 200px;
      }

      .main-content {
        margin-left: 200px;
      }

      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        width: 200px;
        height: auto;
        z-index: 10;
      }

      .main-content {
        margin-left: 0;
        padding: 1rem;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .temperature-display {
        font-size: 2rem;
      }

      .grid-container {
        gap: 1rem;
      }

      .device-card {
        padding: 1.5rem;
      }
    }
  </style>
  <!-- Libraries: Supabase, MQTT, Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">Thermite</div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="controle.html">Controle</a></li>
        <li><a href="#alerts">Alertas</a></li>
        <li><a href="index.html">Início</a></li>
      </ul>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </aside>

    <main class="main-content">
      <div class="header">
        <h1>Dashboard</h1>
        <div class="mqtt-status disconnected" id="mqttStatus">
          <span class="status-dot"></span>
          <span id="mqttStatusText">Desconectado</span>
        </div>
      </div>

      <div class="grid-container" id="devicesGrid">
        <div class="loading">Carregando dispositivos...</div>
      </div>

      <div class="chart-container" id="chartContainer" style="display: none;">
        <h2>Histórico de Temperatura</h2>
        <div class="chart-wrapper">
          <canvas id="temperatureChart"></canvas>
        </div>
      </div>

      <div class="alerts-container">
        <h2 id="alerts">Alertas Recentes</h2>
        <div id="alertsList">
          <div class="loading">Carregando alertas...</div>
        </div>
      </div>
      <footer style="margin-top:2rem;color:#a5b4fc;text-align:center;font-size:0.9rem;">
        <div>Thermite • membros: Otávio e equipe • © <span id="year"></span></div>
      </footer>
    </main>
  </div>

  <script>
    
    const SUPABASE_URL = 'https://lbtnzygqdotxxkgsyeng.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidG56eWdxZG90eHhrZ3N5ZW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTg4NjQsImV4cCI6MjEwMTMzNDg2NH0.ErngBpmCGdEUiMq081lF9n8UtWm6e-M8ESmsAh4PH_Q';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const MQTT_TOPIC = 'iot/otavio';

    let currentUser = null;
    let mqttClient = null;
    let mqttConnected = false;
    let temperatureChart = null;
    let currentDevice = null;
    let temperatureHistory = [];
    let alertsHistory = [];

    window.addEventListener('load', async () => {
      console.log('Inicializando dashboard...');
      await checkAuth();
      loadHistoryFromStorage();
      connectMQTT();
      loadDevices();
      loadAlerts();
    });

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        console.log('Usuário não autenticado');
        window.location.href = 'login.html';
        return;
      }

      currentUser = session.user;
      console.log('Usuário autenticado:', currentUser.email);
    }

    function connectMQTT() {
      console.log('Conectando ao broker MQTT...');
      
      try {
        mqttClient = mqtt.connect(MQTT_BROKER, {
          clientId: 'web-client-' + Math.random().toString(16).substr(2, 8),
          clean: true,
          reconnectPeriod: 1000,
          connectTimeout: 10000
        });

        mqttClient.on('connect', () => {
          console.log('Conectado ao broker MQTT');
          updateMQTTStatus(true);
          mqttClient.subscribe(MQTT_TOPIC, (err) => {
            if (!err) {
              console.log('Inscrito no tópico:', MQTT_TOPIC);
            }
          });
        });

        mqttClient.on('message', (topic, message) => {
          handleMQTTMessage(topic, message);
        });

        mqttClient.on('error', (err) => {
          console.error('Erro MQTT:', err);
          updateMQTTStatus(false);
        });

        mqttClient.on('disconnect', () => {
          console.log('Desconectado do MQTT');
          updateMQTTStatus(false);
        });

      } catch (error) {
        console.error('Erro ao conectar MQTT:', error);
        updateMQTTStatus(false);
      }
    }

    function updateMQTTStatus(connected) {
      mqttConnected = connected;
      const statusEl = document.getElementById('mqttStatus');
      const statusText = document.getElementById('mqttStatusText');
      
      if (connected) {
        statusEl.className = 'mqtt-status connected';
        statusText.textContent = 'Conectado';
      } else {
        statusEl.className = 'mqtt-status disconnected';
        statusText.textContent = 'Desconectado';
      }
    }

    async function handleMQTTMessage(topic, message) {
      if (topic !== MQTT_TOPIC) return;

      const payloadText = message.toString();
      let payload = null;
      let deviceId = null;

      try {
        payload = JSON.parse(payloadText);
      } catch (error) {
        payload = null;
      }

      const temperatura = parseFloat(payload?.temperature ?? payloadText);
      if (payload?.device_id) {
        deviceId = payload.device_id;
      }

      console.log('Temperatura recebida:', temperatura, '°C', 'deviceId:', deviceId);

      if (isNaN(temperatura)) return;

      if (!currentDevice) {
        currentDevice = {
          id: deviceId || 'esp32-default',
          device_name: 'ESP32 MQTT',
          min_temp: 0,
          max_temp: 50,
          location: 'MQTT',
          status: 'normal',
          lastReading: null
        };
      }

      if (deviceId && currentDevice.id === 'esp32-default') {
        currentDevice.id = deviceId;
      }

      // Thresholds: Normal <25, Atenção 25-40, Crítico >40
      let status = 'normal';
      if (temperatura > 40) status = 'critical';
      else if (temperatura >= 25) status = 'warning';

      currentDevice.lastReading = {
        temperature: temperatura,
        humidity: payload?.humidity ?? '--',
        status,
        created_at: new Date().toISOString()
      };
      currentDevice.status = status;

      temperatureHistory.push({
        temperature: temperatura,
        created_at: new Date().toISOString()
      });
      if (temperatureHistory.length > 24) {
        temperatureHistory.shift();
      }

      if (status !== 'normal') {
        alertsHistory.unshift({
          message: status === 'critical'
            ? `Alerta crítico! Temperatura em ${temperatura}°C`
            : `Atenção! Temperatura em ${temperatura}°C`,
          alert_type: status,
          created_at: new Date().toISOString()
        });

        if (alertsHistory.length > 10) {
          alertsHistory.pop();
        }
      }

      // Grava leitura no usuário se der
      if (currentUser?.id) {
        try {
          const { error: upError } = await supabaseClient
            .from('users')
            .update({ last_temp: temperatura, last_seen: new Date().toISOString() })
            .eq('id', currentUser.id);

          if (upError) console.warn('Não foi possível persistir leitura:', upError.message || upError);
        } catch (e) {
          console.warn('Erro ao persistir leitura:', e);
        }
      }

      // persist histories to localStorage so they survive page reloads
      saveHistoryToStorage();

      displayDevices([currentDevice]);
      loadChart();
      loadAlerts();
    }

    async function loadDevices() {
      try {
        if (!currentDevice) {
          currentDevice = {
            id: 'esp32-default',
            device_name: 'ESP32 MQTT',
            min_temp: 0,
            max_temp: 50,
            location: 'MQTT',
            status: 'normal',
            lastReading: null
          };
        }

        displayDevices([currentDevice]);
        loadChart();

      } catch (error) {
        console.error('Erro ao carregar dispositivos:', error);
        document.getElementById('devicesGrid').innerHTML = 
          '<div class="loading">Erro ao carregar dispositivo. Verifique o console.</div>';
      }
    }

    async function displayDevices(devices) {
      const grid = document.getElementById('devicesGrid');
      grid.innerHTML = '';

      for (const device of devices) {
        const temp = device.lastReading?.temperature ?? '--';
        const status = device.lastReading?.status || 'normal';
        const humidity = device.lastReading?.humidity ?? '--';

        const card = document.createElement('div');
        card.className = 'device-card';
        card.innerHTML = `
          <div class="device-header">
            <div class="device-name">${device.device_name}</div>
            <div class="status-badge ${status}">
              ${status === 'critical' ? 'Crítico' : 
                status === 'warning' ? 'Atenção' : 
                'Normal'}
            </div>
          </div>
          <div class="temperature-display">${temp}°C</div>
          <div class="device-info">
            <div class="device-info-row">
              <span class="label">Min/Max:</span>
              <span class="value">${device.min_temp}°C / ${device.max_temp}°C</span>
            </div>
            <div class="device-info-row">
              <span class="label">Local:</span>
              <span class="value">${device.location || 'Não especificado'}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function loadChart() {
      if (!currentDevice || temperatureHistory.length === 0) {
        document.getElementById('chartContainer').style.display = 'none';
        return;
      }

      document.getElementById('chartContainer').style.display = 'block';

      const labels = temperatureHistory.map(r => {
        const date = new Date(r.created_at);
        return date.toLocaleTimeString('pt-BR');
      });

      const data = temperatureHistory.map(r => r.temperature);

      if (temperatureChart) {
        temperatureChart.destroy();
      }

      const ctx = document.getElementById('temperatureChart').getContext('2d');
      temperatureChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Temperatura (°C)',
            data,
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34, 197, 94, 0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.4,
            pointBackgroundColor: '#22c55e',
            pointBorderColor: '#06b6d4',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#a5b4fc' }
            }
          },
          scales: {
            y: {
              ticks: { color: '#a5b4fc' },
              grid: { color: 'rgba(34, 197, 194, 0.1)' }
            },
            x: {
              ticks: { color: '#a5b4fc' },
              grid: { color: 'rgba(34, 197, 194, 0.1)' }
            }
          }
        }
      });
    }

    function loadAlerts() {
      const alertsList = document.getElementById('alertsList');

      if (!alertsHistory || alertsHistory.length === 0) {
        alertsList.innerHTML = '<div class="no-alerts">Nenhum alerta no momento</div>';
        return;
      }

      alertsList.innerHTML = '';
      alertsHistory.forEach(alert => {
        const date = new Date(alert.created_at).toLocaleString('pt-BR');
        const item = document.createElement('div');
        item.className = `alert-item ${alert.alert_type}`;
        item.innerHTML = `
          <div class="alert-message">
            <div>${alert.message}</div>
            <div class="alert-time">${date}</div>
          </div>
        `;
        alertsList.appendChild(item);
      });
    }

    // set footer year
    try { document.getElementById('year').textContent = new Date().getFullYear(); } catch(e){}


        // Salva histórico no localStorage
        function saveHistoryToStorage() {
          try {
            localStorage.setItem('temperatureHistory', JSON.stringify(temperatureHistory));
            localStorage.setItem('alertsHistory', JSON.stringify(alertsHistory));
            if (currentDevice) localStorage.setItem('currentDevice', JSON.stringify(currentDevice));
          } catch (e) {
            console.warn('Erro ao salvar histórico no localStorage:', e);
          }
        }

        function loadHistoryFromStorage() {
          try {
            const th = localStorage.getItem('temperatureHistory');
            const ah = localStorage.getItem('alertsHistory');
            const cd = localStorage.getItem('currentDevice');
            if (th) temperatureHistory = JSON.parse(th) || [];
            if (ah) alertsHistory = JSON.parse(ah) || [];
            if (cd && !currentDevice) currentDevice = JSON.parse(cd);
          } catch (e) {
            console.warn('Erro ao carregar histórico do localStorage:', e);
          }
        }
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      console.log('Fazendo logout...');
      await supabaseClient.auth.signOut();
      if (mqttClient) mqttClient.end();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
