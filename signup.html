<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TempMonitor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --bg-dark: #0a0e27;
      --bg-card: #141829;
      --text-light: #e0e0e0;
      --text-muted: #888888;
      --danger: #ff4444;
      --success: #00ff88;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(20, 24, 41, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, var(--primary) 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .container {
      padding: 2rem;
      width: 100%;
      max-width: 450px;
      margin-top: 60px;
    }

    .form-container {
      background: var(--bg-card);
      border: 1px solid rgba(0, 212, 255, 0.2);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 2rem;
    }

    .form-container p {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem;
      border: 1px solid rgba(0, 212, 255, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-light);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .password-requirements {
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .requirement {
      display: flex;
      align-items: center;
      margin: 0.3rem 0;
    }

    .requirement.met {
      color: var(--success);
    }

    .requirement-icon {
      margin-right: 0.5rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #00ff88 100%);
      color: var(--bg-dark);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10, 14, 39, 0.3);
      border-top: 2px solid var(--bg-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: var(--text-light);
    }

    .error-message {
      background: rgba(255, 68, 68, 0.1);
      border-left: 3px solid var(--danger);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .success-message {
      background: rgba(0, 255, 136, 0.1);
      border-left: 3px solid var(--success);
      color: var(--success);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    @media (max-width: 640px) {
      nav {
        flex-direction: column;
        gap: 1rem;
      }

      .nav-links {
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-container {
        padding: 1.5rem;
      }

      .form-container h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">⚡ TempMonitor</div>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="index.html#recursos">Recursos</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="form-container">
      <h2>Cadastro</h2>
      <p>Crie sua conta TempMonitor</p>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="seu@email.com"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="Mínimo 6 caracteres"
          >
          <div class="password-requirements">
            <div class="requirement" id="reqLength">
              <span class="requirement-icon">○</span>
              <span>Mínimo 6 caracteres</span>
            </div>
            <div class="requirement" id="reqUppercase">
              <span class="requirement-icon">○</span>
              <span>Uma letra maiúscula</span>
            </div>
            <div class="requirement" id="reqNumber">
              <span class="requirement-icon">○</span>
              <span>Um número</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            required 
            placeholder="Confirme sua senha"
          >
        </div>

        <button type="submit" class="btn" id="submitBtn">
          Criar Conta
        </button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login aqui</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('signupForm');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Validação de senha em tempo real
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;

      const lengthReq = document.getElementById('reqLength');
      const uppercaseReq = document.getElementById('reqUppercase');
      const numberReq = document.getElementById('reqNumber');

      if (password.length >= 6) {
        lengthReq.classList.add('met');
        lengthReq.querySelector('.requirement-icon').textContent = '✓';
      } else {
        lengthReq.classList.remove('met');
        lengthReq.querySelector('.requirement-icon').textContent = '○';
      }

      if (/[A-Z]/.test(password)) {
        uppercaseReq.classList.add('met');
        uppercaseReq.querySelector('.requirement-icon').textContent = '✓';
      } else {
        uppercaseReq.classList.remove('met');
        uppercaseReq.querySelector('.requirement-icon').textContent = '○';
      }

      if (/[0-9]/.test(password)) {
        numberReq.classList.add('met');
        numberReq.querySelector('.requirement-icon').textContent = '✓';
      } else {
        numberReq.classList.remove('met');
        numberReq.querySelector('.requirement-icon').textContent = '○';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      // Validações
      if (password.length < 6) {
        errorDiv.textContent = 'A senha deve ter no mínimo 6 caracteres.';
        errorDiv.style.display = 'block';
        return;
      }

      if (!/[A-Z]/.test(password)) {
        errorDiv.textContent = 'A senha deve conter pelo menos uma letra maiúscula.';
        errorDiv.style.display = 'block';
        return;
      }

      if (!/[0-9]/.test(password)) {
        errorDiv.textContent = 'A senha deve conter pelo menos um número.';
        errorDiv.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorDiv.textContent = 'As senhas não conferem.';
        errorDiv.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Criando conta...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        if (error) {
          throw new Error(error.message);
        }

        successDiv.textContent = 'Conta criada com sucesso! Verifique seu email para confirmar.';
        successDiv.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        errorDiv.textContent = error.message || 'Erro ao criar conta. Tente novamente.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Criar Conta';
      }
    });
  </script>
</body>
</html>
