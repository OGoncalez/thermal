<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TempControl</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .signup-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 1rem;
      padding: 3rem 2rem;
      backdrop-filter: blur(10px);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #a5b4fc;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #22c55e;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(34, 197, 194, 0.3);
      border-radius: 0.5rem;
      color: #e0e7ff;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
      background: rgba(15, 23, 42, 1);
    }

    .password-requirements {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(34, 197, 194, 0.2);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .requirement {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      color: #a5b4fc;
    }

    .requirement.met {
      color: #22c55e;
    }

    .requirement-icon {
      margin-right: 0.5rem;
      font-size: 0.9rem;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
      color: #0a0e27;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      display: none;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      display: block;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #86efac;
      display: block;
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #a5b4fc;
    }

    .login-link a {
      color: #22c55e;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #06b6d4;
    }

    .loading {
      display: none;
      text-align: center;
      color: #a5b4fc;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .signup-box {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="signup-box">
      <div class="logo">🌡️ TempControl</div>
      <h1>Cadastro</h1>
      <p class="subtitle">Crie sua conta para começar</p>

      <div id="messageBox" class="message"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Nome Completo</label>
          <input type="text" id="fullName" required placeholder="Seu nome">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
          <div class="password-requirements">
            <div class="requirement" id="req-length">
              <span class="requirement-icon">○</span>
              <span>Mínimo 6 caracteres</span>
            </div>
            <div class="requirement" id="req-upper">
              <span class="requirement-icon">○</span>
              <span>Uma letra maiúscula</span>
            </div>
            <div class="requirement" id="req-number">
              <span class="requirement-icon">○</span>
              <span>Um número</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn">Criar Conta</button>
        <div class="loading" id="loading">Carregando...</div>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login aqui</a>
      </div>
    </div>
  </div>

  <script>
    // ALTERE PARA SUAS CREDENCIAIS SUPABASE
    const SUPABASE_URL = 'https://seu-projeto.supabase.co';
    const SUPABASE_ANON_KEY = 'sua-chave-anonima';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const signupForm = document.getElementById('signupForm');
    const messageBox = document.getElementById('messageBox');
    const loadingDiv = document.getElementById('loading');
    const passwordInput = document.getElementById('password');

    passwordInput.addEventListener('input', (e) => {
      const password = e.target.value;

      const req1 = password.length >= 6;
      const req2 = /[A-Z]/.test(password);
      const req3 = /[0-9]/.test(password);

      updateRequirement('req-length', req1);
      updateRequirement('req-upper', req2);
      updateRequirement('req-number', req3);
    });

    function updateRequirement(id, met) {
      const element = document.getElementById(id);
      if (met) {
        element.classList.add('met');
        element.querySelector('.requirement-icon').textContent = '✓';
      } else {
        element.classList.remove('met');
        element.querySelector('.requirement-icon').textContent = '○';
      }
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      console.log('[v0] Tentando cadastro com email:', email);

      if (password.length < 6 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
        messageBox.className = 'message error';
        messageBox.textContent = 'A senha não atende aos requisitos de segurança.';
        return;
      }

      loadingDiv.style.display = 'block';
      messageBox.className = 'message';
      messageBox.textContent = '';

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          console.error('[v0] Erro de cadastro:', error.message);
          throw error;
        }

        console.log('[v0] Cadastro bem-sucedido:', data.user.email);
        
        const { error: insertError } = await supabase
          .from('users')
          .insert({
            id: data.user.id,
            email,
            full_name: fullName
          });

        if (insertError) {
          console.warn('[v0] Aviso ao criar entrada de usuário:', insertError);
        }

        messageBox.className = 'message success';
        messageBox.textContent = 'Cadastro realizado com sucesso! Redirecionando para login...';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        console.error('[v0] Erro:', error);
        messageBox.className = 'message error';
        messageBox.textContent = error.message || 'Erro ao criar conta. Tente novamente.';
      } finally {
        loadingDiv.style.display = 'none';
      }
    });

    window.addEventListener('load', async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          console.log('[v0] Usuário já está logado');
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('[v0] Erro ao verificar sessão:', error);
      }
    });
  </script>
</body>
</html>
